name: release

# Publishes a release when a version tag is pushed.
#
# The switchboard is the one project here that can be released without a game install, so this is fully
# automated: a hosted runner builds it, and the tag is the version. Pushing v1.2.3 produces a release
# whose binaries report 1.2.3 and name the commit they came from.
#
# What it publishes is the output of build.sh: one self-contained file per platform. There is no Setup
# folder beside the exe any more - the setup runs in-process through ScamWYF.Setup.Core, and the corlib
# and Doorstop it seeds are embedded in the executable - so the release is exactly two files.
#
# It rebuilds rather than reusing the artefact from ci.yml, on purpose. Artefacts expire after 90 days
# and tags do not, so a release driven from an artefact would one day silently have nothing to publish.
# The build is deterministic, so the bytes are the same either way.
#
# The mods cannot use this workflow: they compile against the game's own assemblies, so their build
# needs a self-hosted runner with the game installed.

env:
  # The Setup commit the switchboard is compiled against. A tag, not a branch: the point of building from a
  # tag here is reproducibility, and a moving branch is the opposite of that. ci.yml pins the same value,
  # so a bump is exercised by a normal push before any release depends on it.
  SETUP_REF: v1.0.3

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0 for the tags. A shallow clone has no tag refs, and without them the version stamp
      # falls back to 0.0.0+untagged and stamps a released binary with a version nobody can trace.
      - name: Check out Switchboard
        uses: actions/checkout@v4
        with:
          path: Switchboard
          fetch-depth: 0

      # Not a submodule and not vendored: a second plain checkout, compiled against by the project
      # reference. A submodule would put Setup's 12 MB of vendored binaries into every clone of this
      # repository and into its history, which is the cost the sibling checkout exists to avoid.
      - name: Check out Setup
        uses: actions/checkout@v4
        with:
          repository: swyf-modding/Setup
          ref: ${{ env.SETUP_REF }}
          path: Setup

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Confirm the tag and the commit agree
        working-directory: Switchboard
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          describe="$(git describe --tags --dirty --always)"
          if [ "$describe" != "$tag" ]; then
            echo "HEAD describes as '$describe', not '$tag'. The tag is not on this commit." >&2
            exit 1
          fi
          case "$describe" in
            *-dirty)
              echo "The working tree is dirty. A release must be built from a committed tree." >&2
              exit 1 ;;
          esac
          echo "  $tag -> $describe"

      - name: Build and publish both platforms
        working-directory: Switchboard
        run: ./build.sh

      # Cheap, offline, and the kind of thing that should never be discovered during a release. The
      # install path is the only part of this tool that downloads and writes code, so its defences are
      # worth checking on the exact commit being published rather than on whatever was last pushed.
      - name: Run the offline tests
        working-directory: Switchboard
        run: ./tools/test-getmods.sh

      # Stamping the version is the whole point of building from a tag, and build.sh reads it from
      # `git describe`, whose output the first step already asserted equals the tag. What this step checks
      # is what build.sh cannot check about itself: that it produced the files, and that they are
      # self-contained - the embedded setup payload makes each one tens of megabytes, and a stub would
      # not.
      - name: Confirm the published files are complete
        working-directory: Switchboard
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          for file in dist/linux-x64/Switchboard dist/win-x64/Switchboard.exe; do
            [ -f "$file" ] || { echo "missing $file" >&2; exit 1; }
            size=$(stat -c%s "$file")
            if [ "$size" -lt 20000000 ]; then
              echo "$file is only $size bytes - the embedded payload looks absent" >&2
              exit 1
            fi
            echo "  $file: $size bytes"
          done

          # The pairing of a release to the Setup commit it was compiled against, recorded by the run
          # rather than only inside the binary. Built as a here-doc so the markdown table is readable in
          # the source as well as in the summary.
          {
            echo "| Platform | File | Bytes |"
            echo "|---|---|---|"
            for file in dist/linux-x64/Switchboard dist/win-x64/Switchboard.exe; do
              echo "| $(basename "$(dirname "$file")") | $(basename "$file") | $(stat -c%s "$file") |"
            done
            echo "| Switchboard tag | $tag | |"
            echo "| Setup ref | $SETUP_REF | |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The version a tag names says what kind of build it is, so this reads the tag rather than
      # trusting whoever pushed it:
      #
      #   v0.0.0          a release, and it has to be on main
      #   v0.0.0-1        a hotfix on a release, also on main
      #   v0.0.0-beta.1   a beta, published as a pre-release
      #
      # Every tag carries the leading v. It is not decoration: it is how a tag is told apart from a
      # bare number, and the version stamping strips it.
      #
      # A tag that fits none of those fails here, before anything is built, because a version nobody
      # can classify is a version nobody can reason about later.
      - name: Validate the tag and decide the channel
        id: channel
        working-directory: Switchboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            kind=beta
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            kind=release
          else
            echo "::error::$tag is not a version this repository publishes."
            echo "Use vx.y.z for a release, vx.y.z-N for a hotfix, vx.y.z-beta.N for a beta." >&2
            exit 1
          fi

          # A release that already exists keeps the channel it was published with. The action updates an
          # existing release rather than replacing it, so recomputing here on a rerun would let a
          # branch build be promoted by merging its commit, or demote a published release when the
          # fetch below fails. Only a release that does not exist yet takes the computed channel.
          recorded="$(gh release view "$tag" --json isPrerelease --jq .isPrerelease 2>/dev/null || true)"
          if [[ -n "$recorded" ]]; then
            echo "prerelease=$recorded" >> "$GITHUB_OUTPUT"
            echo "$tag is already published, keeping its channel (prerelease=$recorded)."
            exit 0
          fi

          # A beta is a build of a branch. Anything else is a release, and a release that is not on
          # main is a branch build wearing a release number.
          if [[ "$kind" == release ]]; then
            if ! git fetch --quiet origin main || ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$tag is a release tag, and its commit is not on main."
              exit 1
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag, on main."
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Beta $tag, published as a pre-release."
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Switchboard/dist/linux-x64/Switchboard
            Switchboard/dist/win-x64/Switchboard.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
